version: '3.8'

services:
  neo4j:
    image: neo4j:5.14.0
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  graph-builder:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.builder
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: transactions
    restart: unless-stopped

  ring-score-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
      - "8001:8001"
    restart: unless-stopped
    volumes:
      - ./models:/app/models

  investigator-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.investigator
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    ports:
      - "8002:8001"
    restart: unless-stopped

  monitoring-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.monitoring
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8003:8003"
    restart: unless-stopped

  shadow-mode:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.shadow
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SHADOW_INPUT_TOPIC: transactions
      SHADOW_OUTPUT_TOPIC: shadow_decisions
      SHADOW_SAMPLE_RATE: "0.01"
      FUSION_MODEL_PATH: /app/models/fusion_model.pt
    volumes:
      - ./models:/app/models
    restart: unless-stopped

  batch-community:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.batch
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: unless-stopped

  ttl-cleanup:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.batch
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    command:
      - python
      - -c
      - >-
        from src.graph_builder.ttl_manager import TTLManager; from neo4j import
        GraphDatabase; driver = GraphDatabase.driver('bolt://neo4j:7687',
        auth=('neo4j', 'password')); session = driver.session();
        TTLManager(session).run_cleanup(); session.close(); driver.close()
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
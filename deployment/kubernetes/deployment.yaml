apiVersion: apps/v1
kind: Deployment
metadata:
  name: ring-score-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ring-score-api
  template:
    metadata:
      labels:
        app: ring-score-api
    spec:
      containers:
      - name: api
        image: ring-score-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: NEO4J_URI
          valueFrom:
            secretKeyRef:
              name: neo4j-secret
              key: uri
        - name: NEO4J_USER
          valueFrom:
            secretKeyRef:
              name: neo4j-secret
              key: user
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neo4j-secret
              key: password
        - name: REDIS_HOST
          value: redis-service
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ring-score-api-service
spec:
  selector:
    app: ring-score-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP